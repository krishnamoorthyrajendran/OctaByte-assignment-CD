apiVersion: networking.k8s.io/v1 

kind: Ingress 

metadata: 

  name: my-ingress

  namespace: prod  

  annotations: 

    nginx.ingress.kubernetes.io/rewrite-target: / 

spec: 

  ingressClassName: nginx 

  rules: 

    - host: a70ea54a75e25400aa4fc90627555d65-1203779622.ap-south-1.elb.amazonaws.com

      http: 

        paths: 

          - path: / 

            pathType: Prefix 

            backend: 

              service: 

                name: app-service

                port: 

                  number: 80 
